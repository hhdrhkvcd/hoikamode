l_english:
 SERBIA_1980_NAME:0 "Tito, Yugoslavia and the Breakup — 1980–2008"
 SERBIA_1980_DESC:0 "Start on 1 May 1980. After Tito’s death the federation survives until the 1991 crisis; successor republics emerge in historical sequence, while Serbia gets peaceful and military reunification paths. The game continues past 2008."
 SER_TITO_DESC:0 "Josip Broz Tito, the Yugoslav communist leader. In this scenario he dies on 4 May 1980, as in real history."
 SER_COLLECTIVE_DESC:0 "The collective Yugoslav leadership following Tito’s death."
 SER_LEADER_DESC:0 "Ana Brnabić became Acting President of Serbia in October 2026. In this alternate chronology she rises to power after the federal crisis."
 BOS_LEADER_DESC:0 "Borjana Krišto, Chair of the Council of Ministers of Bosnia and Herzegovina in 2026."
 CRO_LEADER_DESC:0 "Andrej Plenković, Prime Minister of Croatia in 2026."
 MAC_LEADER_DESC:0 "Hristijan Mickoski, Prime Minister of North Macedonia in 2026."
 MNT_LEADER_DESC:0 "Milojko Spajić, Prime Minister of Montenegro in 2026."
 SLV_LEADER_DESC:0 "Janez Janša, Prime Minister of Slovenia from June 2026."
 KOS_LEADER_DESC:0 "Albin Kurti, Kosovo’s Prime Minister-designate in autumn 2026."
 SRP_LEADER_DESC:0 "Siniša Karan, President of Republika Srpska in this 2026 scenario."
 SER_1980_tree:0 "Serbia and the Restoration of Yugoslavia"
 SER_1980_tree_desc:0 "A 50-focus programme spanning political recovery, economic renewal, a federal settlement and a military reunification route."
