 serbia_collapse.1.t:0 "Death of Josip Broz Tito"
 serbia_collapse.1.d:0 "Tito died on 4 May 1980. Yugoslavia does not dissolve immediately: power passes to a collective Presidency, but political and economic tensions deepen."
 serbia_collapse.1.a:0 "Transfer power to collective leadership"
 serbia_collapse.2.t:0 "The First Republics Declare Independence"
 serbia_collapse.2.d:0 "On 25 June 1991 Slovenia and Croatia declared independence. The dissolution of the SFRY begins."
 serbia_collapse.2.a:0 "Acknowledge the beginning of the breakup"
 serbia_collapse.3.t:0 "The Ten-Day War"
 serbia_collapse.3.d:0 "Following Slovenia’s declaration of independence, armed conflict began with the Yugoslav People’s Army."
 serbia_collapse.3.a:0 "Begin the conflict"
 serbia_collapse.4.t:0 "The Brioni Agreement"
 serbia_collapse.4.d:0 "In July 1991, with European Community mediation, the parties agreed to end the brief conflict in Slovenia."
 serbia_collapse.4.a:0 "End hostilities"
 serbia_collapse.5.t:0 "Macedonian Independence Referendum"
 serbia_collapse.5.d:0 "On 8 September 1991, voters in Macedonia supported independence."
 serbia_collapse.5.a:0 "Record the referendum result"
 serbia_collapse.6.t:0 "The Croatian War Escalates"
 serbia_collapse.6.d:0 "During 1991 the conflict in Croatia escalates. The game represents this as a war between Serbia and Croatia."
 serbia_collapse.6.a:0 "Begin the war"
 serbia_collapse.8.t:0 "Proclamation of Republika Srpska"
 serbia_collapse.8.d:0 "On 9 January 1992, Bosnian Serb representatives proclaimed a republic. It is represented as a separate playable tag; its international status was historically disputed."
 serbia_collapse.8.a:0 "Proclaim Republika Srpska"
 serbia_collapse.9.t:0 "Constitution of Republika Srpska"
 serbia_collapse.9.d:0 "On 28 February 1992, the constitution of Republika Srpska was adopted."
 serbia_collapse.9.a:0 "Adopt the constitution"
 serbia_collapse.10.t:0 "Bosnia and Herzegovina Declares Independence"
 serbia_collapse.10.d:0 "After the referendum of 29 February–1 March, Bosnia and Herzegovina declared independence on 3 March 1992."
 serbia_collapse.10.a:0 "Declare independence"
 serbia_collapse.11.t:0 "The Bosnian War Begins"
 serbia_collapse.11.d:0 "The war in Bosnia and Herzegovina began on 6 April 1992. The mod simplifies the conflict to a war between Republika Srpska and Bosnia."
 serbia_collapse.11.a:0 "Begin the conflict"
 serbia_collapse.12.t:0 "Federal Republic of Yugoslavia"
 serbia_collapse.12.d:0 "On 27 April 1992 Serbia and Montenegro proclaimed the Federal Republic of Yugoslavia. In this scenario, the playable tag remains SER."
 serbia_collapse.12.a:0 "Enter a new era"
 serbia_collapse.13.t:0 "The Erdut Agreement"
 serbia_collapse.13.d:0 "On 12 November 1995, the Erdut Agreement created conditions for a peaceful settlement in eastern Croatia."
 serbia_collapse.13.a:0 "Accept the agreement"
 serbia_collapse.14.t:0 "The Dayton Accords"
 serbia_collapse.14.d:0 "The Dayton Accords were signed on 14 December 1995, ending the war in Bosnia."
 serbia_collapse.14.a:0 "Accept peace"
 serbia_collapse.15.t:0 "Montenegro Declares Independence"
 serbia_collapse.15.d:0 "On 3 June 2006, Montenegro declared independence after a referendum."
 serbia_collapse.15.a:0 "Acknowledge Montenegro’s departure"
 serbia_collapse.16.t:0 "Kosovo’s Declaration of Independence"
 serbia_collapse.16.d:0 "On 17 February 2008 Kosovo declared independence. Serbia and a number of other states did not recognise it."
 serbia_collapse.16.a:0 "Respond to the declaration"
 serbia_collapse.17.t:0 "Croatia Formally Leaves the Federation"
 serbia_collapse.17.d:0 "On 8 October 1991, Croatia completed its formal separation from Yugoslav institutions after the moratorium."
 serbia_collapse.17.a:0 "Record the separation"
 serbia_collapse.18.t:0 "European Recognition"
 serbia_collapse.18.d:0 "On 15 January 1992, European Community members recognised Slovenia and Croatia."
 serbia_collapse.18.a:0 "Acknowledge the new reality"
 serbia_collapse.19.t:0 "Macedonia’s Declaration of Independence"
 serbia_collapse.19.d:0 "On 25 September 1991, Macedonia formally confirmed its independent course after the referendum."
 serbia_collapse.19.a:0 "Confirm independence"
 serbia_collapse.20.t:0 "Macedonia’s Constitution"
 serbia_collapse.20.d:0 "On 17 November 1991, the first constitution of independent Macedonia was adopted."
 serbia_collapse.20.a:0 "Adopt the constitution"
 serbia_collapse.21.t:0 "Slovenian Plebiscite"
 serbia_collapse.21.d:0 "On 23 December 1990, voters in Slovenia overwhelmingly supported independence."
 serbia_collapse.21.a:0 "Record the public mandate"
 serbia_collapse.22.t:0 "Croatian Independence Referendum"
 serbia_collapse.22.d:0 "On 19 May 1991, a majority of voters in Croatia supported independence in a referendum."
 serbia_collapse.22.a:0 "Record the result"
