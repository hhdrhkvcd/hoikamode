 serbia_collapse.1.t:0 "Смерть Иосипа Броза Тито"
 serbia_collapse.1.d:0 "Тито умер 4 мая 1980 года. Югославия не распадается мгновенно: управление переходит к коллективному Президиуму, но после его смерти усиливаются экономические и политические противоречия."
 serbia_collapse.1.a:0 "Передать управление коллективному руководству"
 serbia_collapse.2.t:0 "Первые республики объявляют независимость"
 serbia_collapse.2.d:0 "25 июня 1991 года Словения и Хорватия провозгласили независимость. Это начало распада СФРЮ."
 serbia_collapse.2.a:0 "Признать начало распада"
 serbia_collapse.3.t:0 "Десятидневная война"
 serbia_collapse.3.d:0 "После провозглашения независимости Словении началось вооружённое столкновение с Югославской народной армией."
 serbia_collapse.3.a:0 "Начать конфликт"
 serbia_collapse.4.t:0 "Брионское соглашение"
 serbia_collapse.4.d:0 "В июле 1991 года при посредничестве Европейского сообщества стороны согласились завершить краткий конфликт в Словении."
 serbia_collapse.4.a:0 "Прекратить боевые действия"
 serbia_collapse.5.t:0 "Референдум в Македонии"
 serbia_collapse.5.d:0 "8 сентября 1991 года граждане Македонии проголосовали за независимость."
 serbia_collapse.5.a:0 "Зафиксировать результат референдума"
 serbia_collapse.6.t:0 "Эскалация войны в Хорватии"
 serbia_collapse.6.d:0 "Летом 1991 года конфликт в Хорватии расширяется. В игре это представлено войной между Сербией и Хорватией."
 serbia_collapse.6.a:0 "Начать войну"
 serbia_collapse.8.t:0 "Провозглашение Республики Сербской"
 serbia_collapse.8.d:0 "9 января 1992 года сербские представители Боснии провозгласили республику. В моде она представлена отдельной игровой страной; её международный статус исторически был спорным."
 serbia_collapse.8.a:0 "Провозгласить Республику Сербскую"
 serbia_collapse.9.t:0 "Конституция Республики Сербской"
 serbia_collapse.9.d:0 "28 февраля 1992 года была принята конституция Республики Сербской."
 serbia_collapse.9.a:0 "Принять конституцию"
 serbia_collapse.10.t:0 "Независимость Боснии и Герцеговины"
 serbia_collapse.10.d:0 "После референдума 29 февраля — 1 марта Босния и Герцеговина провозгласила независимость 3 марта 1992 года."
 serbia_collapse.10.a:0 "Провозгласить независимость"
 serbia_collapse.11.t:0 "Начало войны в Боснии"
 serbia_collapse.11.d:0 "6 апреля 1992 года началась война в Боснии и Герцеговине. В моде конфликт упрощён до войны между Республикой Сербской и Боснией."
 serbia_collapse.11.a:0 "Начать конфликт"
 serbia_collapse.12.t:0 "Союзная Республика Югославия"
 serbia_collapse.12.d:0 "27 апреля 1992 года Сербия и Черногория провозгласили Союзную Республику Югославию. В сценарии игровым тегом остаётся SER."
 serbia_collapse.12.a:0 "Перейти к новой эпохе"
 serbia_collapse.13.t:0 "Эрдутское соглашение"
 serbia_collapse.13.d:0 "12 ноября 1995 года Эрдутское соглашение создало условия для мирного урегулирования в восточной Хорватии."
 serbia_collapse.13.a:0 "Принять соглашение"
 serbia_collapse.14.t:0 "Дейтонские соглашения"
 serbia_collapse.14.d:0 "14 декабря 1995 года были подписаны Дейтонские соглашения, завершившие войну в Боснии."
 serbia_collapse.14.a:0 "Принять мир"
 serbia_collapse.15.t:0 "Независимость Черногории"
 serbia_collapse.15.d:0 "3 июня 2006 года Черногория объявила независимость после референдума."
 serbia_collapse.15.a:0 "Признать выход Черногории"
 serbia_collapse.16.t:0 "Декларация независимости Косово"
 serbia_collapse.16.d:0 "17 февраля 2008 года Косово провозгласило независимость. Сербия и ряд других государств её не признали."
 serbia_collapse.16.a:0 "Ответить на декларацию"
 serbia_collapse.17.t:0 "Формальный разрыв Хорватии с федерацией"
 serbia_collapse.17.d:0 "8 октября 1991 года Хорватия завершила формальный выход из югославских государственных связей после моратория."
 serbia_collapse.17.a:0 "Зафиксировать выход"
 serbia_collapse.18.t:0 "Европейское признание"
 serbia_collapse.18.d:0 "15 января 1992 года страны Европейского сообщества признали независимость Словении и Хорватии."
 serbia_collapse.18.a:0 "Признать новую реальность"
 serbia_collapse.19.t:0 "Декларация независимости Македонии"
 serbia_collapse.19.d:0 "25 сентября 1991 года Македония закрепила курс на самостоятельность после референдума."
 serbia_collapse.19.a:0 "Закрепить независимость"
 serbia_collapse.20.t:0 "Конституция Македонии"
 serbia_collapse.20.d:0 "17 ноября 1991 года была принята первая конституция независимой Македонии."
 serbia_collapse.20.a:0 "Принять конституцию"
 serbia_collapse.21.t:0 "Плебисцит в Словении"
 serbia_collapse.21.d:0 "23 декабря 1990 года большинство участников плебисцита поддержало независимость Словении."
 serbia_collapse.21.a:0 "Учесть волю избирателей"
 serbia_collapse.22.t:0 "Референдум о независимости Хорватии"
 serbia_collapse.22.d:0 "19 мая 1991 года на референдуме в Хорватии большинство голосовавших поддержало независимость."
 serbia_collapse.22.a:0 "Зафиксировать результат"
