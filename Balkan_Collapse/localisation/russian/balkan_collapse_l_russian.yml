l_russian:
 SERBIA_1980_NAME:0 "Тито, Югославия и распад — 1980–2008"
 SERBIA_1980_DESC:0 "Начни 1 мая 1980 года. После смерти Тито федерация сохраняется до кризиса 1991 года; республики выходят по исторической последовательности, а Сербия получает мирный и военный пути восстановления. Игра продолжается после 2008 года."
 SER_TITO_DESC:0 "Иосип Броз Тито — югославский коммунистический лидер. В сценарии он умирает 4 мая 1980 года, как и в истории."
 SER_COLLECTIVE_DESC:0 "Коллективное руководство Югославии после смерти Тито."
 SER_LEADER_DESC:0 "Ана Брнабич — исполняющая обязанности президента Сербии в октябре 2026 года. В этой альтернативной хронологии она приходит к власти после федеративного кризиса."
 BOS_LEADER_DESC:0 "Боряна Кришто — председатель Совета министров Боснии и Герцеговины в 2026 году."
 CRO_LEADER_DESC:0 "Андрей Пленкович — премьер-министр Хорватии в 2026 году."
 MAC_LEADER_DESC:0 "Христиан Мицкоский — премьер-министр Северной Македонии в 2026 году."
 MNT_LEADER_DESC:0 "Милойко Спаич — премьер-министр Черногории в 2026 году."
 SLV_LEADER_DESC:0 "Янез Янша — премьер-министр Словении с июня 2026 года."
 KOS_LEADER_DESC:0 "Альбин Курти — премьер-министр-назначенец Косово осенью 2026 года."
 SRP_LEADER_DESC:0 "Синиша Каран — президент Республики Сербской в сценарии 2026 года."
 SER_1980_tree:0 "Сербия и восстановление Югославии"
 SER_1980_tree_desc:0 "Два пути: договорное воссоединение бывших республик или военное возвращение территорий."
